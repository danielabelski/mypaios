version: 2

# Grouped version updates, so routine bumps arrive as a few batched PRs
# instead of one per package. Security alerts are unaffected by grouping —
# GitHub always raises those separately and immediately.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/desktop-electron"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      electron-deps:
        patterns: ["*"]

  # Keep the pinned action SHAs in .github/workflows current — without this,
  # actions pinned by commit SHA (as ci.yml does) never get updated.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
